<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sobby Runner</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1d3b2a;
    font-family: "Trebuchet MS", "Comic Sans MS", sans-serif;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  .btn {
    position: absolute;
    bottom: 16px;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,.8);
    background: rgba(255,255,255,.25);
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    display: none;
    align-items: center;
    justify-content: center;
    text-shadow: 0 2px 3px rgba(0,0,0,.5);
  }
  #btnJump { right: 16px; }
  #btnDuck { left: 16px; }
  body.touch .btn { display: flex; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="btnDuck" class="btn">DUK</div>
<div id="btnJump" class="btn">HOP</div>

<script>
(() => {
  // ---------- Opsætning ----------
  const W = 960, H = 420;          // Spillets "logiske" størrelse
  const GROUND = 340;              // Hvor jorden er
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  function resize() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
    canvas.width = W * scale * dpr;
    canvas.height = H * scale * dpr;
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Indstillinger (let at justere) ----------
  const CFG = {
    gravity: 2600,
    jumpSpeed: 980,
    startSpeed: 300,      // pixels pr. sekund på niveau 1
    speedPerLevel: 35,
    maxSpeed: 720,
    pointsPerLevel: 200,
    lives: 3,
    hitForgiveness: 10,   // gør hitboxe mindre, så det er børnevenligt
  };

  // ---------- Lyd (små bip via WebAudio) ----------
  let audio = null;
  function beep(freq, dur, type = 'square', vol = 0.08, slideTo = null) {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator();
      const g = audio.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, audio.currentTime);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, audio.currentTime + dur);
      g.gain.setValueAtTime(vol, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    jump: () => beep(400, 0.18, 'square', 0.06, 800),
    hit: () => beep(220, 0.35, 'sawtooth', 0.08, 80),
    level: () => { beep(523, 0.12); setTimeout(() => beep(659, 0.12), 120); setTimeout(() => beep(784, 0.2), 240); },
    over: () => { beep(392, 0.2, 'triangle', 0.1); setTimeout(() => beep(330, 0.2, 'triangle', 0.1), 200); setTimeout(() => beep(262, 0.4, 'triangle', 0.1), 400); },
  };

  // ---------- Highscore ----------
  function loadHigh() { try { return parseInt(localStorage.getItem('sobbyHigh') || '0', 10) || 0; } catch (e) { return 0; } }
  function saveHigh(v) { try { localStorage.setItem('sobbyHigh', String(v)); } catch (e) {} }

  // ---------- Spiltilstand ----------
  let state = 'start';  // start | play | pause | over
  let sobby, obstacles, clouds, hills, score, level, speed, lives, invuln, spawnTimer, banner, time, highscore, newHigh;

  function reset() {
    sobby = { x: 130, y: GROUND, vy: 0, w: 54, h: 78, onGround: true, ducking: false, runPhase: 0 };
    obstacles = [];
    score = 0; level = 1; speed = CFG.startSpeed; lives = CFG.lives;
    invuln = 0; spawnTimer = 1.2; banner = { text: 'Niveau 1', t: 1.8 }; time = 0;
    highscore = loadHigh(); newHigh = false;
  }

  clouds = Array.from({ length: 5 }, (_, i) => ({ x: i * 220 + Math.random() * 100, y: 40 + Math.random() * 90, s: 0.6 + Math.random() * 0.6 }));
  hills = Array.from({ length: 6 }, (_, i) => ({ x: i * 240, r: 120 + Math.random() * 80 }));
  reset();

  // ---------- Styring ----------
  const input = { jump: false, duck: false };

  function pressJump() {
    if (state === 'start' || state === 'over') { startGame(); return; }
    if (state === 'pause') { state = 'play'; return; }
    input.jump = true;
  }
  function startGame() { reset(); state = 'play'; beep(660, 0.1); }

  window.addEventListener('keydown', e => {
    if (['ArrowUp', 'ArrowDown', ' ', 'Space'].includes(e.key) || e.code === 'Space') e.preventDefault();
    if (e.repeat) return;
    if (e.key === 'ArrowUp' || e.code === 'Space' || e.key === 'w') pressJump();
    if (e.key === 'ArrowDown' || e.key === 's') input.duck = true;
    if ((e.key === 'p' || e.key === 'Escape') && (state === 'play' || state === 'pause')) state = state === 'play' ? 'pause' : 'play';
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowDown' || e.key === 's') input.duck = false;
  });

  // Touch: knapper + tryk på skærmen for at starte
  const btnJump = document.getElementById('btnJump');
  const btnDuck = document.getElementById('btnDuck');
  window.addEventListener('touchstart', () => document.body.classList.add('touch'), { once: true, passive: true });
  btnJump.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); pressJump(); }, { passive: false });
  btnDuck.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); input.duck = true; }, { passive: false });
  btnDuck.addEventListener('touchend', e => { e.preventDefault(); input.duck = false; }, { passive: false });
  canvas.addEventListener('touchstart', e => { e.preventDefault(); pressJump(); }, { passive: false });
  canvas.addEventListener('mousedown', () => pressJump());

  // ---------- Forhindringer ----------
  // Typer: sten og busk (hop over), fugl (duk under), stor sten (hop højt)
  function spawnObstacle() {
    const roll = Math.random();
    const birdChance = level >= 2 ? Math.min(0.15 + level * 0.04, 0.4) : 0;
    let o;
    if (roll < birdChance) {
      o = { type: 'bird', w: 56, h: 34, y: GROUND - 62 - 34, flap: 0 };
    } else if (level >= 3 && roll < birdChance + 0.2) {
      o = { type: 'bigrock', w: 70, h: 56, y: GROUND - 56 };
    } else if (Math.random() < 0.5) {
      o = { type: 'rock', w: 44, h: 36, y: GROUND - 36 };
    } else {
      o = { type: 'bush', w: 62, h: 44, y: GROUND - 44 };
    }
    o.x = W + 20;
    obstacles.push(o);

    // Tid til næste forhindring: kortere jo højere niveau, men altid mulig at klare
    const minGap = Math.max(1.4 - level * 0.08, 0.75);
    spawnTimer = minGap + Math.random() * 0.9;
    // Af og til to tætte forhindringer på højere niveauer
    if (level >= 4 && Math.random() < 0.15 && o.type !== 'bird') {
      obstacles.push({ type: 'rock', w: 44, h: 36, y: GROUND - 36, x: o.x + o.w + 90 });
      spawnTimer += 0.4;
    }
  }

  // ---------- Opdatering ----------
  function update(dt) {
    time += dt;
    // Baggrund bevæger sig altid lidt
    const bgSpeed = state === 'play' ? speed : 60;
    clouds.forEach(c => { c.x -= bgSpeed * 0.1 * c.s * dt; if (c.x < -120) { c.x = W + 50; c.y = 40 + Math.random() * 90; } });
    hills.forEach(h => { h.x -= bgSpeed * 0.3 * dt; if (h.x < -h.r * 2) h.x += 240 * hills.length; });

    if (banner.t > 0) banner.t -= dt;
    if (state !== 'play') return;

    // Point og niveau
    score += speed * dt * 0.05;
    const newLevel = 1 + Math.floor(score / CFG.pointsPerLevel);
    if (newLevel > level) {
      level = newLevel;
      speed = Math.min(CFG.startSpeed + (level - 1) * CFG.speedPerLevel, CFG.maxSpeed);
      banner = { text: 'Niveau ' + level + '!', t: 2 };
      sfx.level();
    }

    // Sobby
    const s = sobby;
    if (input.jump && s.onGround) {
      s.vy = -CFG.jumpSpeed; s.onGround = false; sfx.jump();
    }
    input.jump = false;
    s.ducking = input.duck && s.onGround;
    if (!s.onGround) {
      s.vy += CFG.gravity * (input.duck ? 2.2 : 1) * dt;  // hurtigt ned, hvis man trykker ned i luften
      s.y += s.vy * dt;
      if (s.y >= GROUND) { s.y = GROUND; s.vy = 0; s.onGround = true; }
    }
    s.runPhase += dt * speed / 25;
    if (invuln > 0) invuln -= dt;

    // Forhindringer
    spawnTimer -= dt;
    if (spawnTimer <= 0) spawnObstacle();
    obstacles.forEach(o => { o.x -= speed * dt; if (o.type === 'bird') { o.x -= 40 * dt; o.flap += dt * 12; } });
    obstacles = obstacles.filter(o => o.x + o.w > -20);

    // Kollision
    if (invuln <= 0) {
      const box = sobbyBox();
      for (const o of obstacles) {
        const f = CFG.hitForgiveness;
        if (box.x < o.x + o.w - f && box.x + box.w > o.x + f && box.y < o.y + o.h - f && box.y + box.h > o.y + f) {
          lives--;
          sfx.hit();
          if (lives <= 0) { gameOver(); }
          else { invuln = 1.5; }
          break;
        }
      }
    }
  }

  function sobbyBox() {
    const h = sobby.ducking ? 40 : sobby.h;
    return { x: sobby.x - sobby.w / 2, y: sobby.y - h, w: sobby.w, h };
  }

  function gameOver() {
    state = 'over';
    const final = Math.floor(score);
    if (final > highscore) { highscore = final; newHigh = true; saveHigh(final); }
    sfx.over();
  }

  // ---------- Tegning ----------
  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0, '#7ec8f2');
    sky.addColorStop(1, '#d6f0ff');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Sol
    ctx.fillStyle = '#ffe066';
    ctx.beginPath(); ctx.arc(820, 80, 42, 0, Math.PI * 2); ctx.fill();

    // Skyer
    ctx.fillStyle = '#fff';
    clouds.forEach(c => {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 22 * c.s, 0, Math.PI * 2);
      ctx.arc(c.x + 25 * c.s, c.y - 10 * c.s, 28 * c.s, 0, Math.PI * 2);
      ctx.arc(c.x + 55 * c.s, c.y, 22 * c.s, 0, Math.PI * 2);
      ctx.fill();
    });

    // Bakker
    ctx.fillStyle = '#9ad48a';
    hills.forEach(h => { ctx.beginPath(); ctx.arc(h.x + h.r, GROUND + 30, h.r, Math.PI, 0); ctx.fill(); });

    // Jord
    ctx.fillStyle = '#6cbf4a';
    ctx.fillRect(0, GROUND, W, 14);
    ctx.fillStyle = '#a86f3d';
    ctx.fillRect(0, GROUND + 14, W, H - GROUND - 14);
    // Små striber i jorden, der viser fart
    ctx.fillStyle = '#8f5c30';
    const off = (time * (state === 'play' ? speed : 60)) % 80;
    for (let x = -off; x < W; x += 80) {
      ctx.fillRect(x, GROUND + 34, 30, 5);
      ctx.fillRect(x + 40, GROUND + 58, 20, 5);
    }
  }

  function drawSobby() {
    const s = sobby;
    if (invuln > 0 && Math.floor(invuln * 10) % 2 === 0) return; // blinker efter et hit

    ctx.save();
    ctx.translate(s.x, s.y);
    const duck = s.ducking;
    const sy = duck ? 0.55 : 1;      // klemmes sammen når den dukker
    const bob = s.onGround && !duck ? Math.abs(Math.sin(s.runPhase)) * 3 : 0;

    const green = '#4caf50', dark = '#2e7d32', pink = '#f8a5c2';

    // Hale (bag kroppen)
    const wag = Math.sin(time * 10) * 6;
    ctx.strokeStyle = green; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-20, -24 * sy);
    ctx.quadraticCurveTo(-44, -20 * sy + wag, -48, -44 * sy + wag);
    ctx.stroke();
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-48, -46 * sy + wag, 7, 0, Math.PI * 2); ctx.fill();

    // Ben
    ctx.strokeStyle = dark; ctx.lineWidth = 8;
    if (s.onGround && !duck) {
      const a = Math.sin(s.runPhase) * 10;
      ctx.beginPath(); ctx.moveTo(-8, -16); ctx.lineTo(-8 + a, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(8, -16); ctx.lineTo(8 - a, 0); ctx.stroke();
    } else if (duck) {
      ctx.beginPath(); ctx.moveTo(-12, -8); ctx.lineTo(-16, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(12, -8); ctx.lineTo(16, 0); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(-8, -16); ctx.lineTo(-14, -4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(8, -16); ctx.lineTo(14, -6); ctx.stroke();
    }

    ctx.translate(0, -bob);

    // Krop
    ctx.fillStyle = green;
    ctx.beginPath(); ctx.ellipse(0, -30 * sy, 24, 22 * sy, 0, 0, Math.PI * 2); ctx.fill();
    // Mave
    ctx.fillStyle = '#a5d6a7';
    ctx.beginPath(); ctx.ellipse(6, -26 * sy, 13, 13 * sy, 0, 0, Math.PI * 2); ctx.fill();

    // Hoved
    const hy = duck ? -44 : -62;
    // Store ører (lægger sig bagud når Sobby dukker sig)
    const earTilt = duck ? -1.1 : Math.sin(time * 6) * 0.05;
    drawEar(-6, hy - 10, -0.5 + earTilt, green, pink);
    drawEar(10, hy - 12, 0.45 + earTilt * 1.2, green, pink);

    ctx.fillStyle = green;
    ctx.beginPath(); ctx.arc(4, hy, 20, 0, Math.PI * 2); ctx.fill();

    // Øjne
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(2, hy - 4, 6, 0, Math.PI * 2); ctx.arc(15, hy - 4, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(4, hy - 3, 3, 0, Math.PI * 2); ctx.arc(17, hy - 3, 3, 0, Math.PI * 2); ctx.fill();
    // Næse og smil
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(22, hy + 3, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1b5e20'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(11, hy + 6, 6, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
    // Kinder
    ctx.fillStyle = 'rgba(248,165,194,.6)';
    ctx.beginPath(); ctx.arc(-6, hy + 6, 4, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }

  function drawEar(x, y, angle, green, pink) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = green;
    ctx.beginPath(); ctx.moveTo(-9, 4); ctx.quadraticCurveTo(-16, -30, 0, -52); ctx.quadraticCurveTo(16, -30, 9, 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = pink;
    ctx.beginPath(); ctx.moveTo(-5, 0); ctx.quadraticCurveTo(-10, -26, 0, -42); ctx.quadraticCurveTo(10, -26, 5, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawObstacle(o) {
    ctx.save();
    if (o.type === 'rock' || o.type === 'bigrock') {
      ctx.fillStyle = '#8d8d8d';
      ctx.beginPath();
      ctx.moveTo(o.x, o.y + o.h);
      ctx.quadraticCurveTo(o.x - 2, o.y + o.h * 0.2, o.x + o.w * 0.45, o.y);
      ctx.quadraticCurveTo(o.x + o.w + 4, o.y + o.h * 0.1, o.x + o.w, o.y + o.h);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#b0b0b0';
      ctx.beginPath(); ctx.ellipse(o.x + o.w * 0.4, o.y + o.h * 0.3, o.w * 0.15, o.h * 0.12, -0.4, 0, Math.PI * 2); ctx.fill();
    } else if (o.type === 'bush') {
      ctx.fillStyle = '#2e8b3a';
      ctx.beginPath();
      ctx.arc(o.x + 16, o.y + 26, 18, 0, Math.PI * 2);
      ctx.arc(o.x + 32, o.y + 16, 20, 0, Math.PI * 2);
      ctx.arc(o.x + 48, o.y + 26, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(o.x + 2, o.y + 26, o.w - 4, o.h - 26);
      ctx.fillStyle = '#e53935';
      [[18, 18], [38, 12], [46, 30], [26, 32]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(o.x + dx, o.y + dy, 3.5, 0, Math.PI * 2); ctx.fill(); });
    } else if (o.type === 'bird') {
      const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
      const wing = Math.sin(o.flap) * 14;
      ctx.fillStyle = '#7e57c2';
      ctx.beginPath(); ctx.ellipse(cx, cy, 22, 12, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx - 4, cy - 2); ctx.lineTo(cx + 8, cy - 2); ctx.lineTo(cx + 2, cy - 16 - wing); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(cx - 18, cy - 4, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffb300';
      ctx.beginPath(); ctx.moveTo(cx - 26, cy - 6); ctx.lineTo(cx - 36, cy - 2); ctx.lineTo(cx - 26, cy); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(cx - 20, cy - 7, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(cx - 21, cy - 7, 1.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawHeart(x, y, full) {
    ctx.fillStyle = full ? '#e53935' : 'rgba(0,0,0,.2)';
    ctx.beginPath();
    ctx.moveTo(x, y + 6);
    ctx.bezierCurveTo(x, y, x - 12, y, x - 12, y + 8);
    ctx.bezierCurveTo(x - 12, y + 16, x, y + 20, x, y + 26);
    ctx.bezierCurveTo(x, y + 20, x + 12, y + 16, x + 12, y + 8);
    ctx.bezierCurveTo(x + 12, y, x, y, x, y + 6);
    ctx.fill();
  }

  function text(str, x, y, size, color = '#fff', align = 'center') {
    ctx.font = `bold ${size}px "Trebuchet MS", "Comic Sans MS", sans-serif`;
    ctx.textAlign = align;
    ctx.lineWidth = Math.max(3, size / 7);
    ctx.strokeStyle = 'rgba(0,0,0,.55)';
    ctx.strokeText(str, x, y);
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function drawHUD() {
    for (let i = 0; i < CFG.lives; i++) drawHeart(30 + i * 34, 16, i < lives);
    text('Point: ' + Math.floor(score), W - 20, 40, 26, '#fff', 'right');
    text('Niveau ' + level, W - 20, 72, 20, '#ffe066', 'right');
    if (banner.t > 0 && state === 'play') {
      const a = Math.min(1, banner.t);
      ctx.globalAlpha = a;
      text(banner.text, W / 2, 140, 54, '#ffe066');
      ctx.globalAlpha = 1;
    }
  }

  function overlay() {
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.fillRect(0, 0, W, H);
  }

  function draw() {
    drawBackground();
    obstacles.forEach(drawObstacle);
    drawSobby();

    if (state === 'start') {
      overlay();
      text('Sobby Runner', W / 2, 110, 64, '#8bf28b');
      text('Hjælp den lille trold Sobby med at løbe langt!', W / 2, 160, 24);
      text('HOP:  pil op  /  mellemrum', W / 2, 210, 22, '#ffe066');
      text('DUK:  pil ned', W / 2, 242, 22, '#ffe066');
      if (Math.floor(time * 2) % 2 === 0) text('Tryk mellemrum eller på skærmen for at starte', W / 2, 300, 22);
      if (highscore > 0) text('Bedste: ' + highscore, W / 2, 330, 18, '#ddd');
    } else {
      drawHUD();
    }
    if (state === 'pause') {
      overlay();
      text('Pause', W / 2, 180, 56);
      text('Tryk P for at fortsætte', W / 2, 230, 22);
    }
    if (state === 'over') {
      overlay();
      text('Av! Spillet er slut', W / 2, 120, 52, '#ffb3b3');
      text('Point: ' + Math.floor(score) + '    Niveau: ' + level, W / 2, 175, 28);
      text(newHigh ? 'NY REKORD!' : 'Bedste: ' + highscore, W / 2, 215, 26, '#ffe066');
      if (Math.floor(time * 2) % 2 === 0) text('Tryk mellemrum eller på skærmen for at prøve igen', W / 2, 280, 22);
    }
  }

  // ---------- Game loop ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30); // undgå store hop hvis fanen var skjult
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // Til test
  window.__sobby = { get state() { return state; }, get score() { return score; }, get level() { return level; }, get lives() { return lives; }, get obstacles() { return obstacles; } };
})();
</script>
</body>
</html>
