<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sobby Runner</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1d3b2a;
    font-family: "Trebuchet MS", "Comic Sans MS", sans-serif;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #wrap {
    position: absolute;
    inset: 0;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  .btn {
    position: absolute;
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,.8);
    background: rgba(255,255,255,.25);
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    display: none;
    align-items: center;
    justify-content: center;
    text-shadow: 0 2px 3px rgba(0,0,0,.5);
  }
  body.touch .btn { display: flex; }
  /* Liggende skærm: knapperne står i hver sin kolonne ved siden af spillet */
  body.touch.side #wrap { padding: 0 108px; }
  body.touch.side .btn { bottom: calc(5% + env(safe-area-inset-bottom, 0px)); }
  body.touch.side #btnDuck { left: calc(10px + env(safe-area-inset-left, 0px)); }
  body.touch.side #btnJump { right: calc(10px + env(safe-area-inset-right, 0px)); }
  /* Stående skærm: knapperne står i en bjælke under spillet */
  body.touch.bottom #wrap { padding-bottom: 140px; }
  body.touch.bottom .btn { bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
  body.touch.bottom #btnDuck { left: calc(28px + env(safe-area-inset-left, 0px)); }
  body.touch.bottom #btnJump { right: calc(28px + env(safe-area-inset-right, 0px)); }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="btnDuck" class="btn">DUK</div>
<div id="btnJump" class="btn">HOP</div>

<script>
(() => {
  // ---------- Opsætning ----------
  const W = 720, H = 360;          // Spillets "logiske" størrelse (mindre = mere zoomet ind)
  const GROUND = 300;              // Hvor jorden er
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const SIDE = 108, BOTTOM = 140;  // plads til touch-knapperne uden for spillet
  function resize() {
    let availW = window.innerWidth, availH = window.innerHeight;
    const body = document.body;
    body.classList.remove('side', 'bottom');
    if (body.classList.contains('touch')) {
      if (availW > availH) { body.classList.add('side'); availW -= 2 * SIDE; }
      else { body.classList.add('bottom'); availH -= BOTTOM; }
    }
    const scale = Math.min(availW / W, availH / H);
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
    canvas.width = W * scale * dpr;
    canvas.height = H * scale * dpr;
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Indstillinger (let at justere) ----------
  const CFG = {
    gravity: 2600,
    jumpSpeed: 980,
    startSpeed: 330,      // pixels pr. sekund på niveau 1
    speedPerLevel: 40,
    maxSpeed: 760,
    lives: 3,
    maxLives: 5,          // man kan samle ekstra hjerter op til dette antal
    shieldTime: 6,        // sekunder skjoldet varer
    energyForShield: 10,  // stjerner der skal til for at fylde energibaren (giver skjold)
    starPoints: 25,
    hitForgiveness: 10,   // gør hitboxe mindre, så det er børnevenligt
    testHighscore: 500,   // TESTFASE: rekorden sættes til dette tal, hver gang der kommer en ny version (sæt til null for at slå fra)
  };

  // ---------- Lyd (små bip via WebAudio) ----------
  let audio = null;
  function beep(freq, dur, type = 'square', vol = 0.08, slideTo = null) {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator();
      const g = audio.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, audio.currentTime);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, audio.currentTime + dur);
      g.gain.setValueAtTime(vol, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    jump: () => beep(400, 0.18, 'square', 0.06, 800),
    hit: () => beep(220, 0.35, 'sawtooth', 0.08, 80),
    level: () => { beep(523, 0.12); setTimeout(() => beep(659, 0.12), 120); setTimeout(() => beep(784, 0.2), 240); },
    star: () => { beep(988, 0.07, 'triangle', 0.07); setTimeout(() => beep(1319, 0.1, 'triangle', 0.07), 60); },
    power: () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.12, 'triangle', 0.08), i * 80)); },
    pop: () => beep(500, 0.15, 'square', 0.06, 1400),
    over: () => { beep(392, 0.2, 'triangle', 0.1); setTimeout(() => beep(330, 0.2, 'triangle', 0.1), 200); setTimeout(() => beep(262, 0.4, 'triangle', 0.1), 400); },
  };

  // ---------- Sværhedsgrader ----------
  // Niveauet stiger hurtigt i starten (fra startLevel til rampLevel på rampTime sekunder)
  // og derefter ét niveau for hver 'every' sekunder.
  const MODES = [
    { id: 'begynder', name: 'Begynder', startLevel: 1, rampLevel: 3,  rampTime: 20, every: 12 },
    { id: 'traenet',  name: 'Trænet',   startLevel: 2, rampLevel: 5,  rampTime: 10, every: 9 },
    { id: 'ekspert',  name: 'Ekspert',  startLevel: 5, rampLevel: 10, rampTime: 5,  every: 7 },
  ];
  let modeIndex = 0;
  try { const v = parseInt(localStorage.getItem('sobbyMode'), 10); if (v >= 0 && v < MODES.length) modeIndex = v; } catch (e) {}
  function mode() { return MODES[modeIndex]; }
  function levelAt(t) {
    const md = mode();
    if (t < md.rampTime) return Math.floor(md.startLevel + (md.rampLevel - md.startLevel) * t / md.rampTime);
    return md.rampLevel + Math.floor((t - md.rampTime) / md.every);
  }

  // ---------- Highscore (én rekord for hver sværhedsgrad) ----------
  const memHigh = {};  // reserve, hvis browseren ikke må gemme
  function highKey(i = modeIndex) { return 'sobbyHigh_' + MODES[i].id; }
  function loadHigh(i = modeIndex) {
    try { const v = localStorage.getItem(highKey(i)); if (v !== null) return parseInt(v, 10) || 0; } catch (e) {}
    return memHigh[i] !== undefined ? memHigh[i] : (testHigh || 0);
  }
  function saveHigh(v, i = modeIndex) { memHigh[i] = v; try { localStorage.setItem(highKey(i), String(v)); } catch (e) {} }
  function saveAllHigh(v) { MODES.forEach((_, i) => saveHigh(v, i)); }
  // Test: åbn spillet med #rekord500 i slutningen af linket for at sætte rekorden til 500
  // (#rekord0 nulstiller rekorden). Virker også uden gemt data, så længe siden er åben.
  const GAME_VERSION = 10;  // tælles op ved hver ny version
  let testHigh = CFG.testHighscore;
  try {
    if (CFG.testHighscore !== null && localStorage.getItem('sobbyVersion') !== String(GAME_VERSION)) {
      localStorage.setItem('sobbyVersion', String(GAME_VERSION));
      MODES.forEach((_, i) => localStorage.setItem(highKey(i), String(CFG.testHighscore)));
    }
  } catch (e) {}
  const m = /^#rekord(\d+)$/.exec(location.hash || '');
  if (m) { testHigh = parseInt(m[1], 10); saveAllHigh(testHigh); }

  // ---------- Spiltilstand ----------
  let state = 'start';  // start | play | pause | over
  let sobby, obstacles, clouds, hills, score, level, speed, lives, invuln, spawnTimer, nextType, recordBeaten, playTime, items, popups, shield, energy, powerTimer, skyP = 0, banner, time, highscore, newHigh;

  function speedFor(lvl) { return Math.min(CFG.startSpeed + (lvl - 1) * CFG.speedPerLevel, CFG.maxSpeed); }

  function reset() {
    sobby = { x: 130, y: GROUND, vy: 0, w: 54, h: 78, onGround: true, ducking: false, runPhase: 0 };
    obstacles = [];
    score = 0; playTime = 0; level = levelAt(0); speed = speedFor(level); lives = CFG.lives;
    invuln = 0; spawnTimer = 1.0; nextType = 'rock'; banner = { text: mode().name + ' – niveau ' + level, t: 1.8 }; time = 0;
    highscore = loadHigh(); newHigh = false; recordBeaten = false;
    items = []; popups = []; shield = 0; energy = 0; powerTimer = 10 + Math.random() * 8;
  }

  clouds = Array.from({ length: 5 }, (_, i) => ({ x: i * 220 + Math.random() * 100, y: 40 + Math.random() * 90, s: 0.6 + Math.random() * 0.6 }));
  hills = Array.from({ length: 6 }, (_, i) => ({ x: i * 240, r: 120 + Math.random() * 80 }));
  reset();

  // ---------- Styring ----------
  const input = { jump: false, duck: false };

  function pressJump() {
    if (state === 'start' || state === 'over') { startGame(); return; }
    if (state === 'pause') { state = 'play'; return; }
    input.jump = true;
  }
  function startGame() { reset(); state = 'play'; beep(660, 0.1); }
  function selectMode(i) {
    modeIndex = (i + MODES.length) % MODES.length;
    try { localStorage.setItem('sobbyMode', String(modeIndex)); } catch (e) {}
    highscore = loadHigh();
    beep(520 + modeIndex * 120, 0.08);
  }
  // Knapper til sværhedsgrad på start- og slutskærmen (i spillets koordinater)
  function modeButtonY() { return state === 'over' ? 196 : 186; }
  function modeButtons() {
    return MODES.map((md, i) => ({ i, x: W / 2 + (i - 1) * 200 - 85, y: modeButtonY(), w: 170, h: 46 }));
  }
  function pointerDown(clientX, clientY) {
    if (state === 'start' || state === 'over') {
      const r = canvas.getBoundingClientRect();
      const x = (clientX - r.left) * W / r.width, y = (clientY - r.top) * H / r.height;
      const hit = modeButtons().find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
      if (hit) { selectMode(hit.i); startGame(); return; }
    }
    pressJump();
  }

  window.addEventListener('keydown', e => {
    if (['ArrowUp', 'ArrowDown', ' ', 'Space'].includes(e.key) || e.code === 'Space') e.preventDefault();
    if (e.repeat) return;
    if (e.key === 'ArrowUp' || e.code === 'Space' || e.key === 'w') pressJump();
    if (e.key === 'ArrowDown' || e.key === 's') input.duck = true;
    if (state === 'start' || state === 'over') {
      if (e.key === '1' || e.key === '2' || e.key === '3') selectMode(parseInt(e.key, 10) - 1);
      if (e.key === 'ArrowLeft') selectMode(modeIndex - 1);
      if (e.key === 'ArrowRight') selectMode(modeIndex + 1);
    }
    if ((e.key === 'p' || e.key === 'Escape') && (state === 'play' || state === 'pause')) state = state === 'play' ? 'pause' : 'play';
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowDown' || e.key === 's') input.duck = false;
  });

  // Touch: knapper + tryk på skærmen for at starte
  const btnJump = document.getElementById('btnJump');
  const btnDuck = document.getElementById('btnDuck');
  window.addEventListener('touchstart', () => { document.body.classList.add('touch'); resize(); }, { once: true, passive: true });
  if (window.matchMedia && matchMedia('(pointer: coarse)').matches) { document.body.classList.add('touch'); resize(); }
  btnJump.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); pressJump(); }, { passive: false });
  btnDuck.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); input.duck = true; }, { passive: false });
  btnDuck.addEventListener('touchend', e => { e.preventDefault(); input.duck = false; }, { passive: false });
  canvas.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; pointerDown(t.clientX, t.clientY); }, { passive: false });
  canvas.addEventListener('mousedown', e => pointerDown(e.clientX, e.clientY));

  // ---------- Forhindringer ----------
  // Typer: sten og busk (hop over), høj sten (præcist hop), stor sten (hop højt),
  // fugleflok (kan kun passeres ved at dukke sig).
  // Fugleflokken går fra lige over Sobbys hoved, når den dukker sig, og så højt op,
  // at man ikke kan hoppe over den.
  const FLOCK_BOTTOM = GROUND - 56, FLOCK_TOP = GROUND - 275;
  // Tid (sek.) fra en jordforhindring til en flok (hop, land, dyk) og fra en flok til næste
  // jordforhindring (rejs dig, hop). Bliver strammere med niveauet, men kan altid klares.
  function birdAfterGround() { return Math.max(1.15 - (level - 1) * 0.04, 0.85); }
  function groundAfterBird() { return Math.max(1.05 - (level - 1) * 0.03, 0.8); }
  function rock(x) { return { type: 'rock', w: 54, h: 48, y: GROUND - 48, x }; }

  // En fugleflok har 3-5 fugle, der flyver forskudt. Den nederste er lige over Sobbys
  // hoved, når den dukker sig, og den øverste er så højt, at man ikke kan hoppe over.
  const BIRD_COLORS = ['#7e57c2', '#1e88e5', '#fb8c00', '#ec407a', '#26a69a'];
  function makeFlock() {
    const n = 3 + Math.floor(Math.random() * 3);
    const color = BIRD_COLORS[Math.floor(Math.random() * BIRD_COLORS.length)];
    // Fra niveau 2 kan flokken vugge lidt op og ned (aldrig så meget, at man kan hoppe over eller løbe under)
    const bob = level >= 2 && Math.random() < 0.5 ? 7 : 0;
    const step = (FLOCK_BOTTOM - FLOCK_TOP - 30) / (n - 1);
    const birds = [];
    for (let i = 0; i < n; i++) {
      birds.push({ dx: Math.random() * 44, dy: FLOCK_BOTTOM - 15 - i * step - FLOCK_TOP + (Math.random() * 10 - 5), ph: Math.random() * 6 });
    }
    const maxDx = Math.max(...birds.map(b => b.dx));
    return { type: 'bird', w: 68 + maxDx, h: FLOCK_BOTTOM - FLOCK_TOP, y: FLOCK_TOP, baseY: FLOCK_TOP, bob, bobPh: Math.random() * 6, flap: 0, birds, color };
  }

  function makeObstacle(type) {
    switch (type) {
      case 'bird': return makeFlock();
      case 'tallrock': return { type, w: 50, h: 120, y: GROUND - 120 };
      case 'bigrock': return { type, w: 84, h: 66, y: GROUND - 66 };
      case 'bush': return { type, w: 72, h: 54, y: GROUND - 54 };
      case 'log': return { type, w: 110, h: 34, y: GROUND - 34 };
      case 'mushroom': return { type, w: 58, h: 52, y: GROUND - 52, color: Math.random() < 0.5 ? '#e53935' : '#8e24aa' };
      // Pindsvin løber imod Sobby (hurtigere end jorden)
      case 'hedgehog': return { type, w: 58, h: 38, y: GROUND - 38, vx: 70, step: 0 };
      // Ravn: én hurtig fugl i dukkehøjde. Man kan dukke sig under eller hoppe over.
      case 'crow': return { type, w: 68, h: 30, y: FLOCK_BOTTOM - 30, vx: 110, flap: 0 };
      default: return rock(0);
    }
  }

  // Lavtflyvende fugl: for lav til at dukke sig under, så man skal hoppe over den
  function lowBird(x, bottom) { return { type: 'lowbird', w: 68, h: 30, y: GROUND - bottom - 30, x, flap: Math.random() * 6 }; }

  function isBirdType(t) { return t === 'bird' || t === 'crow'; }
  // Ekstra ventetid før en forhindring, der bevæger sig hurtigere end jorden, så den ikke indhenter den forrige
  function catchUpTime(type) {
    const vx = type === 'crow' ? 110 : type === 'hedgehog' ? 70 : 0;
    if (!vx) return 0;
    const dist = W + 20 - 157;
    return dist / speed - dist / (speed + vx);
  }

  // Vælg næste forhindring. Der kommer aldrig to fugle-forhindringer lige efter hinanden.
  function chooseType(prev) {
    const birdChance = Math.min(0.4 + (level - 1) * 0.03, 0.55);
    if (!isBirdType(prev) && Math.random() < birdChance) return level >= 3 && Math.random() < 0.3 ? 'crow' : 'bird';
    if (level >= 4 && Math.random() < 0.25) return 'combo';
    const r = Math.random();
    const tallChance = level >= 2 ? Math.min(0.1 + level * 0.03, 0.3) : 0;
    if (r < tallChance) return 'tallrock';
    if (level >= 3 && r < tallChance + 0.2) return 'bigrock';
    if (level >= 2 && Math.random() < 0.2) return 'hedgehog';
    const basics = ['rock', 'bush', 'log', 'mushroom'];
    return basics[Math.floor(Math.random() * basics.length)];
  }

  function spawnObstacle() {
    let extra = false;   // længere forhindring, der kræver lidt mere tid bagefter
    let o;
    if (nextType === 'combo') {
      // Sten + 1-2 lavtflyvende fugle lige bagved: klares med ét langt hop
      o = rock(W + 20);
      obstacles.push(o);
      obstacles.push(lowBird(o.x + o.w, 10 + Math.random() * 8));
      if (Math.random() < 0.5) obstacles.push(lowBird(o.x + o.w + 24, 14 + Math.random() * 6));
      extra = true;
    } else {
      o = makeObstacle(nextType);
      o.x = W + 20;
      obstacles.push(o);
    }

    // Tid til næste forhindring: varieret afstand fra starten (tæt, mellem, lang).
    // Den korteste afstand giver altid tid til at lande og hoppe/dukke igen.
    const minGap = Math.max(1.05 - (level - 1) * 0.04, 0.8);
    const r = Math.random();
    const tight = Math.min(0.35 + (level - 1) * 0.04, 0.6);   // flere tætte forhindringer på højere niveauer
    if (r < tight) spawnTimer = minGap + Math.random() * 0.25;          // tæt
    else if (r < tight + 0.3) spawnTimer = minGap + 0.4 + Math.random() * 0.5;  // mellem
    else spawnTimer = minGap + 1.0 + Math.random() * 0.8;                // lang pause
    // Af og til to sten lige efter hinanden (klares med ét godt timet hop)
    if (level >= 4 && Math.random() < 0.15 && nextType === 'rock') {
      obstacles.push(rock(o.x + o.w + 60));
      extra = true;
    }
    if (extra) spawnTimer += 0.4;
    if (o.type === 'log') spawnTimer += 0.15;   // lang stamme: lidt længere tid at lande

    nextType = chooseType(o.type);
    if (isBirdType(nextType)) spawnTimer = Math.max(spawnTimer, birdAfterGround() + (extra ? 0.4 : 0) + (o.type === 'log' ? 0.15 : 0));
    if (isBirdType(o.type)) spawnTimer = Math.max(spawnTimer, groundAfterBird());
    spawnTimer += catchUpTime(nextType);

    placeItems(o, extra);
  }

  // ---------- Stjerner og power-ups ----------
  function star(x, y) { items.push({ type: 'star', x, y, r: 13, ph: Math.random() * 6 }); }
  function placeItems(o, extra) {
    if (o.vx) return;  // intet over forhindringer, der bevæger sig
    const cx = o.x + o.w / 2;
    if (o.type === 'bird') {
      // Stjerner lavt under flokken: tages, når man dukker sig forbi
      if (Math.random() < 0.5) for (let i = 0; i < 3; i++) star(o.x + 10 + i * 34, GROUND - 22);
      return;
    }
    if (o.type === 'crow' || o.type === 'lowbird') return;
    const lift = o.type === 'tallrock' ? 45 : 0;
    if (powerTimer <= 0 && !extra) {
      // Power-up højt over forhindringen: kræver et godt hop
      const kind = lives < CFG.maxLives && Math.random() < 0.5 ? 'heart' : 'shield';
      items.push({ type: kind, x: cx, y: GROUND - 165 - lift, r: 17, ph: 0 });
      powerTimer = 15 + Math.random() * 10;
      return;
    }
    if (Math.random() < 0.45) {
      // Bue af stjerner over forhindringen
      const ext = extra ? 40 : 0;
      star(cx - 48, GROUND - 120 - lift); star(cx + ext / 2, GROUND - 150 - lift); star(cx + 48 + ext, GROUND - 120 - lift);
    } else if (spawnTimer > 1.7 && Math.random() < 0.6) {
      // Stjerner højt oppe i en pause: hop op og tag dem
      const gx = o.x + o.w + speed * spawnTimer * 0.5;
      const h = 130 + Math.random() * 30;
      for (let i = 0; i < 3; i++) star(gx + i * 36 - 36, GROUND - h - (i === 1 ? 12 : 0));
    }
  }

  function collect(it) {
    if (it.type === 'star') {
      score += CFG.starPoints; energy++;
      popups.push({ text: '+' + CFG.starPoints, x: it.x, y: it.y, t: 0.9, color: '#ffe066' });
      sfx.star();
      if (energy >= CFG.energyForShield) {
        energy = 0; shield = CFG.shieldTime;
        banner = { text: 'Fuld energi: skjold!', t: 1.8 }; sfx.power();
      }
    } else if (it.type === 'heart') {
      lives = Math.min(lives + 1, CFG.maxLives);
      popups.push({ text: '+1 liv', x: it.x, y: it.y, t: 1.2, color: '#ff8a80' });
      banner = { text: 'Ekstra liv!', t: 1.5 }; sfx.power();
    } else if (it.type === 'shield') {
      shield = CFG.shieldTime;
      popups.push({ text: 'Skjold!', x: it.x, y: it.y, t: 1.2, color: '#81d4fa' });
      banner = { text: 'Skjold!', t: 1.5 }; sfx.power();
    }
  }

  // ---------- Opdatering ----------
  function update(dt) {
    time += dt;
    // Baggrund bevæger sig altid lidt
    const bgSpeed = state === 'play' ? speed : 60;
    clouds.forEach(c => { c.x -= bgSpeed * 0.1 * c.s * dt; if (c.x < -120) { c.x = W + 50; c.y = 40 + Math.random() * 90; } });
    hills.forEach(h => { h.x -= bgSpeed * 0.3 * dt; if (h.x < -h.r * 2) h.x += 240 * hills.length; });

    if (banner.t > 0) banner.t -= dt;
    // Himlen skifter fra dag (niveau 1) over eftermiddag og solnedgang til nat (niveau 10)
    const skyTarget = state === 'start' ? 0 : Math.min(Math.max((level - 1) / 3, 0), 3);
    skyP += (skyTarget - skyP) * Math.min(dt * 0.8, 1);
    if (state !== 'play') return;

    // Point og niveau
    score += speed * dt * 0.05;
    playTime += dt;
    const newLevel = levelAt(playTime);
    if (newLevel > level) {
      level = newLevel;
      speed = speedFor(level);
      banner = { text: 'Niveau ' + level + '!', t: 2 };
      sfx.level();
    }
    if (!recordBeaten && highscore > 0 && score > highscore) {
      recordBeaten = true;
      banner = { text: 'Ny rekord!', t: 2 };
      sfx.level();
    }

    // Sobby
    const s = sobby;
    if (input.jump && s.onGround) {
      s.vy = -CFG.jumpSpeed; s.onGround = false; sfx.jump();
    }
    input.jump = false;
    s.ducking = input.duck && s.onGround;
    if (!s.onGround) {
      s.vy += CFG.gravity * (input.duck ? 2.2 : 1) * dt;  // hurtigt ned, hvis man trykker ned i luften
      s.y += s.vy * dt;
      if (s.y >= GROUND) { s.y = GROUND; s.vy = 0; s.onGround = true; }
    }
    s.runPhase += dt * speed / 25;
    if (invuln > 0) invuln -= dt;

    // Forhindringer
    spawnTimer -= dt;
    if (spawnTimer <= 0) spawnObstacle();
    obstacles.forEach(o => {
      o.x -= (speed + (o.vx || 0)) * dt;
      if (o.flap !== undefined) o.flap += dt * (o.type === 'crow' ? 18 : 12);
      if (o.bob) o.y = o.baseY + Math.sin(time * 3 + o.bobPh) * o.bob;
      if (o.step !== undefined) o.step += dt * 14;
    });
    obstacles = obstacles.filter(o => o.x + o.w > -20);

    // Stjerner og power-ups
    powerTimer -= dt;
    if (shield > 0) shield -= dt;
    const sb = sobbyBox();
    items.forEach(it => {
      it.x -= speed * dt; it.ph += dt * 4;
      const nx = Math.max(sb.x, Math.min(it.x, sb.x + sb.w)), ny = Math.max(sb.y, Math.min(it.y, sb.y + sb.h));
      if ((nx - it.x) ** 2 + (ny - it.y) ** 2 <= it.r * it.r) { it.taken = true; collect(it); }
    });
    items = items.filter(it => !it.taken && it.x > -30);
    popups.forEach(pp => { pp.t -= dt; pp.y -= 40 * dt; });
    popups = popups.filter(pp => pp.t > 0);

    // Kollision
    if (invuln <= 0) {
      const box = sobbyBox();
      for (const o of obstacles) {
        const f = CFG.hitForgiveness;
        if (box.x < o.x + o.w - f && box.x + box.w > o.x + f && box.y < o.y + o.h - f && box.y + box.h > o.y + f) {
          if (shield > 0) {
            // Skjoldet skubber forhindringen væk
            o.gone = true; score += 10; sfx.pop();
            popups.push({ text: 'Puf! +10', x: o.x + o.w / 2, y: Math.max(o.y, GROUND - 120), t: 0.9, color: '#81d4fa' });
            continue;
          }
          lives--;
          sfx.hit();
          if (lives <= 0) { gameOver(); }
          else { invuln = 1.5; }
          break;
        }
      }
      obstacles = obstacles.filter(o => !o.gone);
    }
  }

  function sobbyBox() {
    const h = sobby.ducking ? 40 : sobby.h;
    return { x: sobby.x - sobby.w / 2, y: sobby.y - h, w: sobby.w, h };
  }

  function gameOver() {
    state = 'over';
    const final = Math.floor(score);
    if (final > highscore) { highscore = final; newHigh = true; saveHigh(final); }
    sfx.over();
  }

  // ---------- Tegning ----------
  const SKY = [
    { top: '#7ec8f2', bot: '#d6f0ff', hill: '#9ad48a', sun: '#ffe066' },  // dag
    { top: '#5aa3e6', bot: '#ffe0a8', hill: '#8cc47a', sun: '#ffc93c' },  // eftermiddag
    { top: '#4b4f9e', bot: '#ff9a6a', hill: '#6f9e62', sun: '#ff7043' },  // solnedgang
    { top: '#0e1a40', bot: '#2c3e75', hill: '#3e6148', sun: '#f5f3ce' },  // nat
  ];
  const SKY_STARS = Array.from({ length: 40 }, () => ({ x: Math.random() * 720, y: Math.random() * 200, r: 0.8 + Math.random() * 1.4, ph: Math.random() * 6 }));
  function mix(a, b, t) {
    const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
    return 'rgb(' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t)).join(',') + ')';
  }
  function skyColor(key) {
    const i = Math.min(Math.floor(skyP), 2), t = skyP - i;
    return mix(SKY[i][key], SKY[i + 1][key], t);
  }

  function drawBackground() {
    const night = Math.min(Math.max(skyP - 2, 0), 1);
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0, skyColor('top'));
    sky.addColorStop(1, skyColor('bot'));
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Stjerner på nattehimlen
    if (night > 0) {
      ctx.fillStyle = '#fff';
      SKY_STARS.forEach(st => { ctx.globalAlpha = night * (0.5 + 0.5 * Math.sin(time * 2 + st.ph)); ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill(); });
      ctx.globalAlpha = 1;
    }

    // Sol, der går ned, og måne om natten
    const sunY = 70 + Math.min(skyP, 2) * 35;
    ctx.globalAlpha = 1 - night;
    ctx.fillStyle = skyColor('sun');
    ctx.beginPath(); ctx.arc(W - 250, sunY, 38, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = night;
    ctx.fillStyle = '#f5f3ce';
    ctx.beginPath(); ctx.arc(W - 250, 60, 30, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = skyColor('top');
    ctx.beginPath(); ctx.arc(W - 238, 52, 26, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    // Skyer
    ctx.fillStyle = night > 0 ? `rgba(255,255,255,${1 - night * 0.7})` : '#fff';
    clouds.forEach(c => {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 22 * c.s, 0, Math.PI * 2);
      ctx.arc(c.x + 25 * c.s, c.y - 10 * c.s, 28 * c.s, 0, Math.PI * 2);
      ctx.arc(c.x + 55 * c.s, c.y, 22 * c.s, 0, Math.PI * 2);
      ctx.fill();
    });

    // Bakker
    ctx.fillStyle = skyColor('hill');
    hills.forEach(h => { ctx.beginPath(); ctx.arc(h.x + h.r, GROUND + 30, h.r, Math.PI, 0); ctx.fill(); });

    // Jord
    ctx.fillStyle = '#6cbf4a';
    ctx.fillRect(0, GROUND, W, 14);
    ctx.fillStyle = '#a86f3d';
    ctx.fillRect(0, GROUND + 14, W, H - GROUND - 14);
    // Små striber i jorden, der viser fart
    ctx.fillStyle = '#8f5c30';
    const off = (time * (state === 'play' ? speed : 60)) % 80;
    for (let x = -off; x < W; x += 80) {
      ctx.fillRect(x, GROUND + 34, 30, 5);
      ctx.fillRect(x + 40, GROUND + 58, 20, 5);
    }
    // Lidt mørkere jord om aftenen og natten
    if (skyP > 1) { ctx.fillStyle = `rgba(10, 20, 50, ${0.3 * Math.min(skyP - 1, 2) / 2})`; ctx.fillRect(0, GROUND, W, H - GROUND); }
  }

  function drawSobby() {
    const s = sobby;
    if (invuln > 0 && Math.floor(invuln * 10) % 2 === 0) return; // blinker efter et hit

    ctx.save();
    ctx.translate(s.x, s.y);
    const duck = s.ducking;
    const sy = duck ? 0.55 : 1;      // klemmes sammen når den dukker
    const bob = s.onGround && !duck ? Math.abs(Math.sin(s.runPhase)) * 3 : 0;

    const green = '#4caf50', dark = '#2e7d32', pink = '#f8a5c2';

    // Superhelte-kappe, når man har slået rekorden
    if (recordBeaten) {
      const wave = Math.sin(time * 14) * 5;
      ctx.save();
      ctx.translate(0, -bob);
      const w2 = Math.sin(time * 14 + 1.5) * 5;
      ctx.fillStyle = '#d32f2f';
      ctx.beginPath();
      ctx.moveTo(10, -52 * sy);
      ctx.lineTo(-8, -54 * sy);
      // øverste kant flagrer bagud
      ctx.bezierCurveTo(-28, -62 * sy + wave, -50, -54 * sy - wave, -74, -58 * sy + wave * 1.5);
      // bagkant med bølger
      ctx.quadraticCurveTo(-66 + w2, -44 * sy, -78, -32 * sy + wave);
      ctx.quadraticCurveTo(-68 - w2, -22 * sy, -76, -8 * sy + w2);
      // nederste kant tilbage til ryggen
      ctx.bezierCurveTo(-56, -4 * sy - wave, -30, -14 * sy + w2, -6, -24 * sy);
      ctx.closePath(); ctx.fill();
      // folder i kappen
      ctx.strokeStyle = '#a31515'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-14, -48 * sy); ctx.quadraticCurveTo(-40, -42 * sy - wave * 0.5, -66, -40 * sy + wave); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-12, -34 * sy); ctx.quadraticCurveTo(-38, -26 * sy + w2 * 0.5, -64, -20 * sy + w2); ctx.stroke();
      // krave
      ctx.fillStyle = '#b71c1c';
      ctx.beginPath(); ctx.ellipse(1, -51 * sy, 11, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // Hale (bag kroppen)
    const wag = Math.sin(time * 10) * 6;
    ctx.strokeStyle = green; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-20, -24 * sy);
    ctx.quadraticCurveTo(-44, -20 * sy + wag, -48, -44 * sy + wag);
    ctx.stroke();
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-48, -46 * sy + wag, 7, 0, Math.PI * 2); ctx.fill();

    // Ben
    ctx.strokeStyle = dark; ctx.lineWidth = 8;
    if (s.onGround && !duck) {
      const a = Math.sin(s.runPhase) * 10;
      ctx.beginPath(); ctx.moveTo(-8, -16); ctx.lineTo(-8 + a, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(8, -16); ctx.lineTo(8 - a, 0); ctx.stroke();
    } else if (duck) {
      ctx.beginPath(); ctx.moveTo(-12, -8); ctx.lineTo(-16, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(12, -8); ctx.lineTo(16, 0); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(-8, -16); ctx.lineTo(-14, -4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(8, -16); ctx.lineTo(14, -6); ctx.stroke();
    }

    ctx.translate(0, -bob);

    // Krop
    ctx.fillStyle = green;
    ctx.beginPath(); ctx.ellipse(0, -30 * sy, 24, 22 * sy, 0, 0, Math.PI * 2); ctx.fill();
    // Mave
    ctx.fillStyle = '#a5d6a7';
    ctx.beginPath(); ctx.ellipse(6, -26 * sy, 13, 13 * sy, 0, 0, Math.PI * 2); ctx.fill();

    // Hoved
    const hy = duck ? -44 : -62;
    // Store ører (lægger sig bagud når Sobby dukker sig)
    const earTilt = duck ? -1.1 : Math.sin(time * 6) * 0.05;
    drawEar(-6, hy - 10, -0.5 + earTilt, green, pink);
    drawEar(10, hy - 12, 0.45 + earTilt * 1.2, green, pink);

    ctx.fillStyle = green;
    ctx.beginPath(); ctx.arc(4, hy, 20, 0, Math.PI * 2); ctx.fill();
    // Bliver mere og mere rød i hovedet, jo højere niveau
    const red = Math.min((level - 1) / 7, 1);
    if (red > 0) {
      // Rødmen starter på kinderne og breder sig over hele ansigtet
      const r = 8 + 16 * red;
      const grad = ctx.createRadialGradient(6, hy + 3, 0, 6, hy + 3, r);
      grad.addColorStop(0, `rgba(255, 60, 60, ${0.5 + 0.45 * red})`);
      grad.addColorStop(0.6, `rgba(255, 60, 60, ${0.35 + 0.45 * red})`);
      grad.addColorStop(1, 'rgba(255, 60, 60, 0)');
      ctx.save();
      ctx.beginPath(); ctx.arc(4, hy, 20, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = grad;
      ctx.fillRect(-20, hy - 22, 48, 44);
      ctx.restore();
    }

    // Øjne
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(2, hy - 4, 6, 0, Math.PI * 2); ctx.arc(15, hy - 4, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(4, hy - 3, 3, 0, Math.PI * 2); ctx.arc(17, hy - 3, 3, 0, Math.PI * 2); ctx.fill();
    // Næse og smil
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(22, hy + 3, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1b5e20'; ctx.lineWidth = 2;
    // Smilet bliver mindre, jo rødere han bliver (ved niveau 8 er munden en lille sur streg)
    const smile = 1 - 1.3 * red;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(5, hy + 8); ctx.quadraticCurveTo(11, hy + 8 + 10 * smile, 17, hy + 8); ctx.stroke();
    // Kinder
    ctx.fillStyle = 'rgba(248,165,194,.6)';
    ctx.beginPath(); ctx.arc(-6, hy + 6, 4, 0, Math.PI * 2); ctx.fill();

    // Sveder, når man er tæt på rekorden (inden for 100 point)
    if (state === 'play' && highscore > 0 && !recordBeaten && score >= highscore - 100) {
      for (let i = 0; i < 3; i++) {
        const t = (time * 1.6 + i / 3) % 1;          // hver dråbe går fra 0 til 1
        const side = i === 1 ? 1 : -1;
        const dx = side * (14 + t * 22) + 4;
        const dy = hy - 16 + t * t * 40 - t * 18;
        drawDrop(dx, dy, 1 - t * 0.6);
      }
      drawDrop(-8, hy - 12, 1);  // dråbe på panden
    }

    ctx.restore();
  }

  function drawDrop(x, y, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#64b5f6';
    ctx.beginPath();
    ctx.moveTo(x, y - 11);
    ctx.quadraticCurveTo(x + 8, y, x, y + 6);
    ctx.quadraticCurveTo(x - 8, y, x, y - 11);
    ctx.fill();
    ctx.strokeStyle = '#1e88e5'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(x - 2, y, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawEar(x, y, angle, green, pink) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = green;
    ctx.beginPath(); ctx.moveTo(-9, 4); ctx.quadraticCurveTo(-16, -30, 0, -52); ctx.quadraticCurveTo(16, -30, 9, 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = pink;
    ctx.beginPath(); ctx.moveTo(-5, 0); ctx.quadraticCurveTo(-10, -26, 0, -42); ctx.quadraticCurveTo(10, -26, 5, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawObstacle(o) {
    ctx.save();
    if (o.type === 'tallrock') {
      ctx.fillStyle = '#7a7f87';
      ctx.beginPath();
      ctx.moveTo(o.x, o.y + o.h);
      ctx.lineTo(o.x + 4, o.y + 18);
      ctx.quadraticCurveTo(o.x + o.w * 0.5, o.y - 8, o.x + o.w - 4, o.y + 14);
      ctx.lineTo(o.x + o.w, o.y + o.h);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#a3a8b0';
      ctx.fillRect(o.x + 12, o.y + 22, 7, o.h - 40);
      ctx.fillStyle = '#5f9e47';
      ctx.beginPath(); ctx.ellipse(o.x + o.w * 0.55, o.y + 6, 12, 5, 0, 0, Math.PI * 2); ctx.fill();
    } else if (o.type === 'rock' || o.type === 'bigrock') {
      ctx.fillStyle = '#8d8d8d';
      ctx.beginPath();
      ctx.moveTo(o.x, o.y + o.h);
      ctx.quadraticCurveTo(o.x - 2, o.y + o.h * 0.2, o.x + o.w * 0.45, o.y);
      ctx.quadraticCurveTo(o.x + o.w + 4, o.y + o.h * 0.1, o.x + o.w, o.y + o.h);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#b0b0b0';
      ctx.beginPath(); ctx.ellipse(o.x + o.w * 0.4, o.y + o.h * 0.3, o.w * 0.15, o.h * 0.12, -0.4, 0, Math.PI * 2); ctx.fill();
    } else if (o.type === 'bush') {
      ctx.translate(o.x, o.y);
      ctx.scale(o.w / 62, o.h / 44);
      ctx.fillStyle = '#2e8b3a';
      ctx.beginPath();
      ctx.arc(16, 26, 18, 0, Math.PI * 2);
      ctx.arc(32, 16, 20, 0, Math.PI * 2);
      ctx.arc(48, 26, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(2, 26, 58, 18);
      ctx.fillStyle = '#e53935';
      [[18, 18], [38, 12], [46, 30], [26, 32]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(dx, dy, 3.5, 0, Math.PI * 2); ctx.fill(); });
    } else if (o.type === 'bird') {
      // Flok af forskudte fugle
      for (const b of o.birds) drawBird(o.x + 42 + b.dx, o.y + b.dy + Math.sin(time * 5 + b.ph) * 2, o.flap + b.ph, o.color);
    } else if (o.type === 'lowbird') {
      drawBird(o.x + 42, o.y + o.h / 2, o.flap, '#fb8c00');
    } else if (o.type === 'crow') {
      drawBird(o.x + 42, o.y + o.h / 2, o.flap, '#37474f', true);
    } else if (o.type === 'log') {
      ctx.fillStyle = '#8d5a2b';
      ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(o.x, o.y + 2, o.w, o.h - 2, 14); else ctx.rect(o.x, o.y + 2, o.w, o.h - 2); ctx.fill();
      ctx.strokeStyle = '#6d4220'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(o.x + 14, o.y + 12); ctx.lineTo(o.x + o.w - 26, o.y + 12); ctx.moveTo(o.x + 20, o.y + 24); ctx.lineTo(o.x + o.w - 34, o.y + 24); ctx.stroke();
      ctx.fillStyle = '#d7a86e';
      ctx.beginPath(); ctx.ellipse(o.x + o.w - 10, o.y + o.h / 2 + 1, 10, o.h / 2 - 1, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#a0703c';
      ctx.beginPath(); ctx.ellipse(o.x + o.w - 10, o.y + o.h / 2 + 1, 5, 8, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#5f9e47';
      ctx.beginPath(); ctx.ellipse(o.x + 34, o.y + 3, 10, 4, 0, 0, Math.PI * 2); ctx.fill();
    } else if (o.type === 'mushroom') {
      ctx.fillStyle = '#f3e5c8';
      ctx.fillRect(o.x + o.w / 2 - 9, o.y + 22, 18, o.h - 22);
      ctx.fillStyle = o.color;
      ctx.beginPath(); ctx.ellipse(o.x + o.w / 2, o.y + 24, o.w / 2, 24, 0, Math.PI, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff';
      [[-14, 12], [6, 6], [16, 16], [-2, 18]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(o.x + o.w / 2 + dx, o.y + dy, 4, 0, Math.PI * 2); ctx.fill(); });
    } else if (o.type === 'hedgehog') {
      const cx = o.x + o.w / 2, by = o.y + o.h;
      ctx.fillStyle = '#5d4037';
      ctx.beginPath();
      ctx.moveTo(o.x + 6, by - 4);
      for (let i = 0; i <= 8; i++) { const a = Math.PI + i * Math.PI / 8; ctx.lineTo(cx + 6 + Math.cos(a) * 30 * (i % 2 ? 1.1 : 0.85), by - 6 + Math.sin(a) * 36 * (i % 2 ? 1.05 : 0.8)); }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#bcaaa4'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#d7b98e';
      ctx.beginPath(); ctx.ellipse(o.x + 12, by - 12, 13, 10, -0.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(o.x + 1, by - 13, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(o.x + 10, by - 17, 2, 0, Math.PI * 2); ctx.fill();
      const leg = Math.sin(o.step) * 4;
      ctx.fillStyle = '#4e342e';
      ctx.fillRect(o.x + 16 + leg, by - 5, 6, 5); ctx.fillRect(o.x + 36 - leg, by - 5, 6, 5);
    }
    ctx.restore();
  }

  function drawBird(cx, cy, flap, color = '#7e57c2', crow = false) {
    const wing = Math.sin(flap) * 14;
    ctx.fillStyle = color;
    if (crow) {  // lys kant, så ravnen kan ses om natten
      ctx.strokeStyle = '#cfd8dc'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(cx, cy, 26, 15, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx - 21, cy - 5, 11, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.beginPath(); ctx.ellipse(cx, cy, 26, 15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx - 6, cy - 2); ctx.lineTo(cx + 10, cy - 2); ctx.lineTo(cx + 2, cy - 20 - wing); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(cx - 21, cy - 5, 11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = crow ? '#ffca28' : '#ffb300';
    ctx.beginPath(); ctx.moveTo(cx - 30, cy - 8); ctx.lineTo(cx - 42, cy - 3); ctx.lineTo(cx - 30, cy); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx - 23, cy - 8, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = crow ? '#d50000' : '#222';
    ctx.beginPath(); ctx.arc(cx - 24, cy - 8, 1.8, 0, Math.PI * 2); ctx.fill();
    if (crow) {  // vrede øjenbryn på ravnen
      ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx - 29, cy - 14); ctx.lineTo(cx - 18, cy - 11); ctx.stroke();
    }
  }

  // ---------- Tegning af stjerner, power-ups, skjold og point ----------
  function drawStarShape(x, y, r, rot) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
  }
  function drawItems() {
    for (const it of items) {
      const bobY = it.y + Math.sin(it.ph) * 3;
      if (it.type === 'star') {
        ctx.fillStyle = '#ffd600'; ctx.strokeStyle = '#f57f17'; ctx.lineWidth = 2;
        drawStarShape(it.x, bobY, it.r + 1, Math.sin(it.ph * 0.5) * 0.3); ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(it.x - 3, bobY - 3, 2.5, 0, Math.PI * 2); ctx.fill();
      } else {
        // Glød bag power-up
        const glow = ctx.createRadialGradient(it.x, bobY, 4, it.x, bobY, 32);
        glow.addColorStop(0, it.type === 'heart' ? 'rgba(255,138,128,.8)' : 'rgba(129,212,250,.8)');
        glow.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(it.x, bobY, 32, 0, Math.PI * 2); ctx.fill();
        if (it.type === 'heart') { ctx.save(); ctx.translate(it.x, bobY - 13); ctx.scale(1.2, 1.2); drawHeart(0, 0, true); ctx.restore(); }
        else drawShieldIcon(it.x, bobY, 15);
      }
    }
  }
  function drawShieldIcon(x, y, r) {
    ctx.fillStyle = '#29b6f6'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, y - r); ctx.lineTo(x + r, y - r * 0.6); ctx.quadraticCurveTo(x + r, y + r * 0.6, x, y + r);
    ctx.quadraticCurveTo(x - r, y + r * 0.6, x - r, y - r * 0.6); ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
  function drawShieldBubble() {
    if (shield <= 0 || state !== 'play') return;
    if (shield < 1.5 && Math.floor(shield * 8) % 2 === 0) return;  // blinker, når det er ved at løbe ud
    const h = sobby.ducking ? 40 : sobby.h;
    const cx = sobby.x - 4, cy = sobby.y - h / 2 - 8;
    const r = 54 + Math.sin(time * 6) * 2;
    const g = ctx.createRadialGradient(cx, cy, r * 0.5, cx, cy, r);
    g.addColorStop(0, 'rgba(129,212,250,0.05)'); g.addColorStop(1, 'rgba(41,182,246,0.45)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(cx - r * 0.4, cy - r * 0.45, 10, 5, -0.6, 0, Math.PI * 2); ctx.fill();
  }
  function drawPopups() {
    for (const pp of popups) { ctx.globalAlpha = Math.min(1, pp.t * 2); text(pp.text, pp.x, pp.y, 20, pp.color); }
    ctx.globalAlpha = 1;
  }

  function drawHeart(x, y, full) {
    ctx.fillStyle = full ? '#e53935' : 'rgba(0,0,0,.2)';
    ctx.beginPath();
    ctx.moveTo(x, y + 6);
    ctx.bezierCurveTo(x, y, x - 12, y, x - 12, y + 8);
    ctx.bezierCurveTo(x - 12, y + 16, x, y + 20, x, y + 26);
    ctx.bezierCurveTo(x, y + 20, x + 12, y + 16, x + 12, y + 8);
    ctx.bezierCurveTo(x + 12, y, x, y, x, y + 6);
    ctx.fill();
  }

  function text(str, x, y, size, color = '#fff', align = 'center') {
    ctx.font = `bold ${size}px "Trebuchet MS", "Comic Sans MS", sans-serif`;
    ctx.textAlign = align;
    ctx.lineWidth = Math.max(3, size / 7);
    ctx.strokeStyle = 'rgba(0,0,0,.55)';
    ctx.strokeText(str, x, y);
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function drawHUD() {
    for (let i = 0; i < Math.max(CFG.lives, lives); i++) drawHeart(30 + i * 34, 16, i < lives);
    // Energibar: fyldes af stjerner, giver skjold når den er fuld
    const bx = 22, by = 52, bw = 120;
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(bx, by, bw, 12, 6); else ctx.rect(bx, by, bw, 12); ctx.fill();
    const fill = shield > 0 ? shield / CFG.shieldTime : energy / CFG.energyForShield;
    ctx.fillStyle = shield > 0 ? '#29b6f6' : '#ffd600';
    if (fill > 0) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(bx, by, bw * fill, 12, 6); else ctx.rect(bx, by, bw * fill, 12); ctx.fill(); }
    ctx.fillStyle = shield > 0 ? '#29b6f6' : '#ffd600'; ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5;
    if (shield > 0) drawShieldIcon(bx + bw + 14, by + 6, 8); else { drawStarShape(bx + bw + 14, by + 6, 9, 0); ctx.fill(); ctx.stroke(); }
    text('Point: ' + Math.floor(score), W - 20, 40, 26, '#fff', 'right');
    text(mode().name + ' · niveau ' + level, W - 20, 72, 20, '#ffe066', 'right');
    if (banner.t > 0 && state === 'play') {
      const a = Math.min(1, banner.t);
      ctx.globalAlpha = a;
      text(banner.text, W / 2, 125, 50, '#ffe066');
      ctx.globalAlpha = 1;
    }
  }

  function drawModeButtons() {
    const colors = ['#43a047', '#fb8c00', '#e53935'];
    for (const b of modeButtons()) {
      const sel = b.i === modeIndex;
      ctx.fillStyle = colors[b.i];
      ctx.globalAlpha = sel ? 1 : 0.6;
      ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(b.x, b.y, b.w, b.h, 14); else ctx.rect(b.x, b.y, b.w, b.h); ctx.fill();
      ctx.globalAlpha = 1;
      if (sel) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke(); }
      text((b.i + 1) + '. ' + MODES[b.i].name, b.x + b.w / 2, b.y + 31, 22);
    }
  }

  function overlay() {
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.fillRect(0, 0, W, H);
  }

  function draw() {
    drawBackground();
    if (state !== 'start') drawItems();
    obstacles.forEach(drawObstacle);
    drawSobby();
    drawShieldBubble();
    if (state === 'play') drawPopups();

    if (state === 'start') {
      overlay();
      text('Sobby Runner', W / 2, 72, 56, '#8bf28b');
      text('Hjælp den lille trold Sobby med at løbe langt!', W / 2, 112, 22);
      text('HOP: pil op / mellemrum     DUK: pil ned', W / 2, 148, 19, '#ffe066');
      text('Vælg sværhedsgrad:', W / 2, 176, 18, '#ddd');
      drawModeButtons();
      if (Math.floor(time * 2) % 2 === 0) text('Tryk på en sværhedsgrad for at starte', W / 2, 270, 20);
      text('Bedste (' + mode().name + '): ' + highscore, W / 2, 298, 17, '#ddd');
    } else if (state !== 'over') {
      drawHUD();
    }
    if (state === 'pause') {
      overlay();
      text('Pause', W / 2, 180, 56);
      text('Tryk P for at fortsætte', W / 2, 230, 22);
    }
    if (state === 'over') {
      overlay();
      text('Av! Spillet er slut', W / 2, 76, 46, '#ffb3b3');
      text('Point: ' + Math.floor(score) + '    Niveau: ' + level, W / 2, 120, 26);
      text(newHigh ? 'NY REKORD!' : 'Bedste (' + mode().name + '): ' + highscore, W / 2, 156, 22, '#ffe066');
      text('Spil igen:', W / 2, 186, 17, '#ddd');
      drawModeButtons();
      if (Math.floor(time * 2) % 2 === 0) text('Tryk mellemrum for samme sværhedsgrad', W / 2, 282, 19);
    }
  }

  // ---------- Game loop ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30); // undgå store hop hvis fanen var skjult
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // Til test
  window.__sobby = { get state() { return state; }, get score() { return score; }, get level() { return level; }, get lives() { return lives; }, get obstacles() { return obstacles; }, get speed() { return speed; }, get playTime() { return playTime; }, get mode() { return mode().id; }, get items() { return items; }, get shield() { return shield; }, get energy() { return energy; } };
})();
</script>
</body>
